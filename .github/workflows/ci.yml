name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8
    
    - name: Install dependencies
      run: pnpm install
    
    - name: Build
      run: pnpm build
    
    - name: Test
      run: pnpm test
    
    - name: Check code style
      run: pnpm lint || true

  test-smart-router:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
    
    - name: Install pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8
    
    - name: Install dependencies
      run: pnpm install
    
    - name: Test Smart Router
      run: |
        node --input-type=module -e "
        import { classifyRequest } from './lib/gabrielos/smart-router.js';
        const tests = [
          { req: 'What is my shopping list?', expected: 'rag' },
          { req: 'Build a trading bot', expected: 'agent' },
          { req: 'Run backup now', expected: 'workflow' }
        ];
        let passed = 0;
        for (const t of tests) {
          const result = classifyRequest(t.req);
          if (result.level === t.expected) {
            console.log('✓', t.req, '→', result.level);
            passed++;
          } else {
            console.log('✗', t.req, 'expected', t.expected, 'got', result.level);
          }
        }
        console.log(\`\nPassed: \${passed}/\${tests.length}\`);
        process.exit(passed === tests.length ? 0 : 1);
        "
