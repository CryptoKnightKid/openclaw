version: '3.8'

services:
  gabriel:
    build: .
    container_name: gabriel
    restart: unless-stopped
    volumes:
      - ./config.json:/app/config.json:ro
      - ./memory:/app/memory
      - ./logs:/app/logs
    environment:
      - NODE_ENV=production
      - GABRIELOS_VERSION=1.0.0
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Redis for session caching
  redis:
    image: redis:7-alpine
    container_name: gabriel-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"

volumes:
  redis-data:
